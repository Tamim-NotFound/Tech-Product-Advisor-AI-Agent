services:

  tech-product-advisor-agent:
    build: .
    container_name: tech-product-advisor-agent-api

    ports:
      - "8002:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/tech-product-advisor-agent

    volumes:
      - ./app:/app/app

    depends_on:
      db:
        condition: service_healthy

    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: pgvector/pgvector:pg17
    container_name: tech-product-advisor-agent-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tech-product-advisor-agent

    ports:
      - "5432:5432"

    volumes:
      - tech-product-advisor-agent-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tech-product-advisor-agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tech-product-advisor-agent-db-data: